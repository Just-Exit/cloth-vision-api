services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: cloth-vision-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cloth_vision}
      POSTGRES_USER: ${POSTGRES_USER:-cloth_vision}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cloth_vision}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-cloth_vision} -d ${POSTGRES_DB:-cloth_vision}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:

